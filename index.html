<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌸 My Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #FDF2F8; --bg-b: #F3EFFC; --bg-c: #EAF6FB;
    --surface: #FFFFFF; --ink: #4A3B52; --ink-soft: #A594AE;
    --line: #F1DCEA; --accent: #C68FD9; --accent-2: #7EC8E3;
    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font-body);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{ max-width: 640px; width: 100%; }
  .eyebrow{
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    text-align: center; display:block; margin-bottom: 6px;
  }
  h1{
    font-family: var(--font-display); font-size: 28px; font-weight: 700;
    text-align: center; margin: 0 0 28px;
  }
  .cards{ display: grid; gap: 16px; }
  @media (min-width: 560px){ .cards{ grid-template-columns: 1fr 1fr; } }
  a.card{
    display: block; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 26px 20px;
    box-shadow: 0 6px 20px rgba(198,143,217,0.14);
    transition: transform 0.15s ease;
  }
  a.card:hover{ transform: translateY(-3px); }
  .card .icon{ font-size: 34px; display:block; margin-bottom: 10px; }
  .card .title{ font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .card .desc{ font-size: 13px; color: var(--ink-soft); font-weight: 600; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">🌸 My Tools</span>
    <h1>Pick a checklist</h1>
    <div class="cards">
      <a class="card" href="task-checklist.html">
        <span class="icon">📝</span>
        <span class="title">Task Report</span>
        <span class="desc">Daily task tracker → WhatsApp-ready message with cute status tags.</span>
      </a>
      <a class="card" href="trading/">
        <span class="icon">📈</span>
        <span class="title">Trading Operations</span>
        <span class="desc">Daily routine, trade gate, weekly review, quarter goal &amp; guardrails.</span>
      </a>
    </div>
  </div>
</body>
</html>
